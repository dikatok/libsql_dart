name: libsql_dart
description: "LibSQL Dart client library to interact with LibSQL/Turso database instance."
version: 0.8.0
homepage:
repository: https://github.com/dikatok/libsql_dart
issue_tracker: https://github.com/dikatok/libsql_dart/issues

environment:
  sdk: ">=3.4.4 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  code_assets: ^1.0.0
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.10.0
  freezed_annotation: ^3.1.0
  hooks: ^1.0.2
  native_toolchain_rust: ^1.0.3
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  build_runner: ^2.13.1
  ffi: ^2.2.0
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  integration_test:
    sdk: flutter

